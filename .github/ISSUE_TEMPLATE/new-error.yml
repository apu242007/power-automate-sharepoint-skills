name: New error or trap / Nuevo error o trampa
description: A symptom you hit in a Power Automate + SharePoint pipeline that the catalog does not cover.
labels: [catalog]
body:
  - type: textarea
    id: symptom
    attributes:
      label: Exact symptom / Síntoma exacto
      description: The message as shown (or the observable behavior), where it appears and in which step.
    validations: {required: true}
  - type: textarea
    id: cause
    attributes:
      label: Cause / Causa
      description: What you found. Say if it is documented, or your own observation.
    validations: {required: true}
  - type: textarea
    id: fix
    attributes:
      label: Fix you tested / Arreglo probado
    validations: {required: true}
  - type: input
    id: source
    attributes:
      label: Source / Fuente
      description: Microsoft Learn link or "own observation". Date checked.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Privacidad
      options:
        - label: I removed tenants, company names, emails, trigger URLs (sig=) and ids.
          required: true
